<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCalc | Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <div class="header">
            <div>
                <h2>SmartCalc</h2>
                <p>Smart calculations, simplified.</p>
            </div>
            <span class="icon">⚡</span>
        </div>

        <div class="display">
            <div id="expression">Ready to calculate</div>
            <input type="text" id="result" value="0"
                   placeholder="0" readonly>
        </div>

        <div class="buttons">
            <button class="special" onclick="clearDisplay()">AC</button>
            <button class="special" onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="appendValue('(')">(</button>
            <button class="operator" onclick="appendValue(')')">)</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button class="special" onclick="appendValue('%')">%</button>
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button class="equal" onclick="calculate()">=</button>
        </div>

        <div class="footer">
            <span>SMART • FAST • ACCURATE</span>
            <span>v1.0</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
